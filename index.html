<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meteor Challenge — scipio.labs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #03030f;
      --surface: #08081c;
      --border:  #16163a;
      --text:    #b0b0d8;
      --muted:   #454568;
      --red:     #ff3b3b;
      --blue:    #3b6eff;
      --star:    #ffffff;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 4rem;
      gap: 3rem;
    }

    @keyframes tw  { to { opacity: 0.05; } }
    @keyframes scan { to { top: 100%; } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.25; } }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
    @keyframes fadeslide { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @keyframes shoot {
      0%   { transform: translate(0,0);           opacity: 0; }
      4%   {                                       opacity: 1; }
      100% { transform: translate(110vw, 40vh);   opacity: 0; }
    }

    /* Shooting star */
    .comet {
      position: fixed;
      top: 12%;
      left: -5%;
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,80,80,.9), transparent);
      animation: shoot 9s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    .comet:nth-child(2) { top: 35%; animation-delay: 4s; animation-duration: 12s; width: 60px; }

    /* All real content sits above the starfield */
    header, .frame-wrap, .stats-grid, .transmission, footer { position: relative; z-index: 1; }

    /* ── Header ── */
    header { text-align: center; }

    .logo {
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--star);
    }

    .logo em {
      font-style: normal;
      color: var(--red);
    }

    .tagline {
      margin-top: .4rem;
      font-size: .65rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .rule {
      width: 100%;
      max-width: 560px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: .75rem auto 0;
    }

    /* ── Image ── */
    .frame-wrap {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,59,59,.08),
        0 0 60px rgba(255,59,59,.08),
        0 0 120px rgba(0,0,60,.3);
    }

    #myImage {
      display: block;
      max-width: min(704px, 90vw);
      height: auto;
    }

    .scanline {
      position: absolute;
      inset-inline: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,59,59,.7), transparent);
      animation: scan 2.4s ease-in-out infinite;
      opacity: 0;
      transition: opacity .2s;
    }
    .scanline.running { opacity: 1; }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.25rem 1rem;
      text-align: center;
      opacity: 0;
      transition: opacity .35s ease, transform .35s ease;
      transform: translateY(8px);
    }

    .card.show { opacity: 1; transform: none; }
    .card:nth-child(2) { transition-delay: .1s; }
    .card:nth-child(3) { transition-delay: .2s; }

    .card-icon { font-size: 1.1rem; margin-bottom: .4rem; }
    .card-num  { font-size: 2.2rem; font-weight: 700; line-height: 1; margin-bottom: .25rem; }
    .card-lbl  { font-size: .6rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

    .c-star  .card-num { color: var(--star); text-shadow: 0 0 14px rgba(255,255,255,.5); }
    .c-red   .card-num { color: var(--red);  text-shadow: 0 0 14px rgba(255,59,59,.5);  }
    .c-blue  .card-num { color: var(--blue); text-shadow: 0 0 14px rgba(59,110,255,.5); }

    /* ── Transmission ── */
    .transmission {
      width: 100%;
      max-width: 560px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      overflow: hidden;
      opacity: 0;
      transition: opacity .4s ease .3s;
    }
    .transmission.show { opacity: 1; }

    .tx-bar {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem 1rem;
      border-bottom: 1px solid var(--border);
      background: rgba(255,59,59,.04);
    }

    .tx-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }

    .tx-label {
      font-size: .6rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .tx-body {
      padding: 1.25rem 1rem;
      font-size: .82rem;
      color: var(--text);
      line-height: 1.75;
      min-height: 3.5rem;
    }

    .cursor {
      display: inline-block;
      width: .45em;
      height: 1.1em;
      background: var(--red);
      vertical-align: text-bottom;
      margin-left: 1px;
      animation: blink .75s step-end infinite;
    }

    /* ── Footer ── */
    footer {
      font-size: .6rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- Animated comets -->
  <div class="comet"></div>
  <div class="comet"></div>

  <header>
    <p class="logo">Meteor <em>Challenge</em></p>
    <p class="tagline">scipio.labs · pixel analysis</p>
    <div class="rule"></div>
  </header>

  <div class="frame-wrap">
    <img src="image.png" id="myImage" alt="Challenge image" />
    <div class="scanline" id="scanline"></div>
  </div>

  <section class="stats-grid">
    <div class="card c-star">
      <div class="card-icon">★</div>
      <div class="card-num" id="n-stars">—</div>
      <div class="card-lbl">Stars</div>
    </div>
    <div class="card c-red">
      <div class="card-icon">●</div>
      <div class="card-num" id="n-meteors">—</div>
      <div class="card-lbl">Meteors</div>
    </div>
    <div class="card c-blue">
      <div class="card-icon">〜</div>
      <div class="card-num" id="n-water">—</div>
      <div class="card-lbl">Above Water</div>
    </div>
  </section>

  <section class="transmission" id="transmission">
    <div class="tx-bar">
      <div class="tx-dot"></div>
      <span class="tx-label">Hidden Transmission Decoded</span>
    </div>
    <div class="tx-body" id="tx-body"></div>
  </section>

  <footer>pedrofrxncx · scipio.labs</footer>

  <script src="index.js"></script>
</body>
</html>
